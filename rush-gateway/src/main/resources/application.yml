server:
  port: 8080

spring:
  application:
    name: rush-gateway
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  autoconfigure:
    # 로그인 사용자가 없으므로 기본 사용자와 임시 비밀번호를 만들지 않습니다.
    exclude: org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
          routes:
            # ---- Spring 서비스: Eureka에서 찾아갑니다 (lb://서비스이름) ----
            - id: rush-auth
              uri: lb://rush-auth
              predicates: [Path=/auth/**]
              filters:
                - name: CircuitBreaker
                  args:
                    name: rush-auth
                    fallbackUri: forward:/fallback
            - id: rush-shop
              uri: lb://rush-shop
              predicates: [Path=/shop/**]
              filters:
                - name: CircuitBreaker
                  args:
                    name: rush-shop
                    fallbackUri: forward:/fallback
            - id: rush-minigame
              uri: lb://rush-minigame
              predicates: [Path=/minigame/**]
              filters:
                - name: CircuitBreaker
                  args:
                    name: rush-minigame
                    fallbackUri: forward:/fallback
            - id: rush-stage
              uri: lb://rush-stage
              predicates: [Path=/stage/**]
              filters:
                - name: CircuitBreaker
                  args:
                    name: rush-stage
                    fallbackUri: forward:/fallback

            # ---- NestJS 서비스: 주소로 바로 연결 ----
            - id: rush-user
              uri: ${USER_URL:http://localhost:8085}
              predicates: [Path=/user/**]
              filters:
                - name: CircuitBreaker
                  args:
                    name: rush-user
                    fallbackUri: forward:/fallback
            - id: rush-sp
              uri: ${SP_URL:http://localhost:8086}
              predicates: [Path=/sp/**]
              filters:
                - name: CircuitBreaker
                  args:
                    name: rush-sp
                    fallbackUri: forward:/fallback

            # ---- Go 실시간 서비스: WebSocket ----
            - id: rush-live
              uri: ${LIVE_URL:ws://localhost:8087}
              predicates: [Path=/live/**]
            - id: rush-chat
              uri: ${CHAT_URL:ws://localhost:8088}
              predicates: [Path=/chat/**]

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

# health만 공개되고, 나머지는 SecurityConfig가 gateway.admin-allowed-ips에서만 허용합니다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, circuitbreakers
  endpoint:
    gateway:
      # SCG 기본값은 none(꺼짐)입니다. 라우트 조회만 열고 생성·삭제·refresh는 막습니다.
      access: read-only
