server:
  port: 8761

spring:
  application:
    name: rush-eureka

eureka:
  client:
    # Eureka 서버 자신은 등록하지 않습니다.
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
