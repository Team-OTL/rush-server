# 모든 서비스가 공통으로 받는 설정
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-bytes}
